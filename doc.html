<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải chương...</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lora&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ed; --text-main: #2b3a2e; --text-sub: #555555;
            --btn-color: #8c6239; --card-bg: #fefdfa; --divider: #e0dcd2;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Lora', serif; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .navigation-links { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 13px; text-transform: uppercase; font-weight: bold; }
        .nav-btn { color: var(--btn-color); text-decoration: none; }
        h1 { font-family: 'Playfair Display', serif; font-size: 26px; text-align: center; margin-bottom: 10px; }
        .story-title-sub { text-align: center; font-size: 13px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 40px; letter-spacing: 1px; }
        .content-area { font-size: 18px; line-height: 1.8; text-align: justify; color: #222; }
        .content-area p { margin-bottom: 25px; text-indent: 20px; }
        .editor-note { background-color: #f1ede4; border-left: 4px solid var(--btn-color); padding: 15px 20px; font-size: 15px; color: #5c6b5d; font-style: italic; margin-bottom: 30px; border-radius: 0 6px 6px 0; line-height: 1.6; }
        .inner-divider { border: none; border-top: 1px dashed var(--divider); width: 40%; margin: 40px auto; }
        .footer-nav { border-top: 1px solid var(--divider); padding-top: 30px; margin-top: 40px; display: flex; justify-content: space-between; margin-bottom: 40px; }
        .footer-btn { background-color: var(--btn-color); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; text-transform: uppercase; text-decoration: none; }
        
        /* Khung bình luận */
        .comments-section { border-top: 1px solid var(--divider); padding-top: 40px; margin-top: 40px; }
        .comments-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text-main); margin-bottom: 20px; font-weight: 600; }
        
        .error-box { text-align: center; padding: 20px; }
        .error-box h3 { margin-bottom: 15px; color: #8c6239; }
    </style>
</head>
<body>
    <!-- SDK Facebook để chạy tính năng bình luận -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js#xfbml=1&version=v18.0"></script>

    <div class="container" id="reader-container">
        <div class="navigation-links">
            <a href="#" id="toc-link" class="nav-btn">🗂 Mục Lục</a>
            <a href="index.html" class="nav-btn">🏠 Trang Chủ</a>
        </div>
        
        <h1 id="chapter-title">Đang tải nội dung...</h1>
        <div class="story-title-sub" id="story-title">Đang tải...</div>
        
        <div class="content-area" id="content-area"></div>
        
        <div class="footer-nav">
            <a href="#" id="prev-btn" class="footer-btn">Chương trước</a>
            <a href="#" id="next-btn" class="footer-btn">Chương sau</a>
        </div>

        <!-- KHUNG BÌNH LUẬN FACEBOOK -->
        <div class="comments-section">
            <h3 class="comments-title">Bình luận chương</h3>
            <div id="fb-comment-box"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const truyen = params.get('truyen') || 'vong-tron';
        const chuong = parseInt(params.get('chuong')) || 1;

        const storyNames = { 'vong-tron': 'Vòng Tròn Định Mệnh' };
        const storyName = storyNames[truyen] || 'Tên Truyện';
        const tocFile = truyen + '-dinh-menh.html';

        document.getElementById('toc-link').href = tocFile;
        document.getElementById('story-title').innerText = storyName;

        const txtPath = `${truyen}-data/${truyen}-${chuong}.txt`;

        fetch(txtPath)
            .then(response => {
                if (!response.ok) throw new Error("Chương này chưa được cập nhật hoặc không tồn tại!");
                return response.text();
            })
            .then(text => {
                parseAndDisplay(text);
                loadFacebookComments(); // Gọi bình luận Facebook sau khi tải xong chữ
            })
            .catch(error => {
                showError(error.message);
            });

        function parseAndDisplay(text) {
            const lines = text.split('\n');
            const title = lines[0].trim();
            document.getElementById('chapter-title').innerText = title;
            document.title = title + " - " + storyName;

            const contentLines = lines.slice(1);
            let htmlContent = "";

            contentLines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.length === 0) return;

                if (trimmed === "-" || trimmed === "---" || trimmed === "*" || trimmed === "* * *") {
                    htmlContent += "            <hr class=\"inner-divider\">\n";
                } 
                else if (trimmed.startsWith("*") || trimmed.toLowerCase().includes("chú thích") || trimmed.toLowerCase().includes("lưu ý")) {
                    const cleanNote = trimmed.replace(/^\*|\*$/g, '').trim();
                    htmlContent += "            <div class=\"editor-note\">" + cleanNote + "</div>\n";
                } 
                else {
                    htmlContent += "            <p>" + trimmed + "</p>\n";
                }
            });

            document.getElementById('content-area').innerHTML = htmlContent;

            const prevBtn = document.getElementById('prev-btn');
            if (chuong <= 1) {
                prevBtn.href = tocFile;
                prevBtn.innerText = "Mục Lục";
                prevBtn.style.background = "#9ba89c";
            } else {
                prevBtn.href = `doc.html?truyen=${truyen}&chuong=${chuong - 1}`;
            }

            const nextBtn = document.getElementById('next-btn');
            nextBtn.href = `doc.html?truyen=${truyen}&chuong=${chuong + 1}`;
        }

        // TỰ ĐỘNG KHỞI TẠO KHUNG BÌNH LUẬN THEO ĐƯỜNG LINK RIÊNG BIỆT CỦA CHƯƠNG ĐÓ
        function loadFacebookComments() {
            const currentUrl = window.location.href; // Lấy link chính xác của chương hiện tại
            const box = document.getElementById('fb-comment-box');
            box.innerHTML = `<div class="fb-comments" data-href="${currentUrl}" data-width="100%" data-numposts="10" data-colorscheme="light"></div>`;
            
            // Ép Facebook quét và hiển thị lại khung bình luận
            if (typeof FB !== 'undefined') {
                FB.XFBML.parse();
            }
        }

        function showError(message) {
            const container = document.getElementById('reader-container');
            container.innerHTML = `
                <div class="error-box">
                    <h3>⚠️ Không Tìm Thấy Chương!</h3>
                    <p>${message}</p>
                    <br>
                    <a href="${tocFile}" class="footer-btn" style="display:inline-block; margin-top: 15px; text-decoration:none;">Quay lại Mục Lục</a>
                </div>
            `;
        }
    </script>
</body>
</html>
