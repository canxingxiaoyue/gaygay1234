<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải chương...</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ed; --text-main: #2b3a2e; --text-sub: #555555;
            --btn-color: #8c6239; --card-bg: #fefdfa; --divider: #e0dcd2;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Lora', serif; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .navigation-links { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 13px; text-transform: uppercase; font-weight: bold; }
        .nav-btn { color: var(--btn-color); text-decoration: none; }
        h1 { font-family: 'Playfair Display', serif; font-size: 26px; text-align: center; margin-bottom: 10px; }
        .story-title-sub { text-align: center; font-size: 13px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 40px; letter-spacing: 1px; }
        
        /* KHUNG ĐỌC TRUYỆN CHỮ CHÍNH */
        .content-area { font-size: 18px; line-height: 1.8; text-align: justify; color: #222; }
        .content-area p { margin-bottom: 25px; text-indent: 20px; }
        
        /* CHÚ THÍCH EDITOR & ĐƯỜNG KẺ */
        .editor-note { background-color: #f1ede4; border-left: 4px solid var(--btn-color); padding: 15px 20px; font-size: 15px; color: #5c6b5d; font-style: italic; margin-bottom: 30px; border-radius: 0 6px 6px 0; line-height: 1.6; }
        .inner-divider { border: none; border-top: 1px dashed var(--divider); width: 40%; margin: 40px auto; }
        
        /* NÚT CHUYỂN CHƯƠNG */
        .footer-nav { border-top: 1px solid var(--divider); padding-top: 30px; margin-top: 40px; display: flex; justify-content: space-between; margin-bottom: 40px; }
        .footer-btn { background-color: var(--btn-color); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; text-transform: uppercase; text-decoration: none; }
        
        /* KHUNG BÌNH LUẬN TRONG TRANG ĐỌC */
        .comments-section { border-top: 1px solid var(--divider); padding-top: 40px; margin-top: 40px; }
        .comments-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text-main); margin-bottom: 25px; font-weight: 600; }
        
        .comment-input-box { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-bottom: 40px; }
        .comment-name-input { width: 100%; padding: 12px 15px; background-color: var(--bg-color); border: 1px solid var(--divider); border-radius: 4px; font-family: 'Lora', serif; font-size: 14px; outline: none; color: #222; }
        .comment-input { width: 100%; height: 90px; padding: 15px; background-color: var(--bg-color); border: 1px solid var(--divider); border-radius: 4px; font-family: 'Lora', serif; font-size: 14px; resize: none; outline: none; color: #222; }
        .comment-name-input::placeholder, .comment-input::placeholder { color: #9ba89c; font-style: italic; }
        .btn-submit-comment { background-color: var(--text-main); color: white; border: none; padding: 8px 20px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-submit-comment:hover { background-color: var(--btn-color); }
        
        .comments-list { margin-top: 30px; }
        .comment-item { background: var(--bg-color); border: 1px solid var(--divider); padding: 20px; border-radius: 4px; margin-bottom: 15px; position: relative; text-align: left; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #777; margin-bottom: 8px; border-bottom: 1px dashed var(--divider); padding-bottom: 8px; }
        .comment-author { font-weight: bold; color: var(--btn-color); font-size: 14px;}
        .comment-date { margin-left: 10px; }
        .comment-body { font-size: 14px; line-height: 1.5; color: #222; text-align: left; }
        
        .btn-delete { color: #ef4444; cursor: pointer; font-size: 12px; transition: 0.2s; font-weight: bold; font-family: sans-serif; }
        .btn-delete:hover { color: #b91c1c; text-decoration: underline; }

        .no-comments { text-align: center; padding: 20px 0; }
        .no-comments h4 { font-size: 16px; color: var(--text-main); margin-bottom: 5px; }
        .no-comments p { font-size: 13px; color: #888; }

        .error-box { text-align: center; padding: 20px; }
        .error-box h3 { margin-bottom: 15px; color: #8c6239; }
    </style>
</head>
<body>

    <div class="container" id="reader-container">
        <!-- Điều hướng đầu trang -->
        <div class="navigation-links">
            <a href="#" id="toc-link" class="nav-btn">🗂 Mục Lục</a>
            <a href="index.html" class="nav-btn">🏠 Trang Chủ</a>
        </div>
        
        <h1 id="chapter-title">Đang tải nội dung...</h1>
        <div class="story-title-sub" id="story-title">Đang tải...</div>
        
        <!-- Nội dung chương -->
        <div class="content-area" id="content-area"></div>
        
        <!-- Nút chuyển chương -->
        <div class="footer-nav">
            <a href="#" id="prev-btn" class="footer-btn">Chương trước</a>
            <a href="#" id="next-btn" class="footer-btn">Chương sau</a>
        </div>

        <!-- KHUNG BÌNH LUẬN RIÊNG BIỆT CHO TỪNG CHƯƠNG -->
        <div class="comments-section">
            <h3 class="comments-title">Bình luận chương</h3>
            
            <div class="comment-input-box">
                <input type="text" class="comment-name-input" id="comment-name" placeholder="Tên của bạn (bỏ trống sẽ là Ẩn danh)">
                <textarea class="comment-input" id="comment-input" placeholder="Viết bình luận chương này tại đây nhé..."></textarea>
                <button class="btn-submit-comment" id="comment-submit">Gửi bình luận</button>
            </div>

            <div class="no-comments" id="no-comments">
                <h4>Chia sẻ suy nghĩ của bạn về chương này</h4>
                <p>Hãy là người đầu tiên viết bình luận cho chương này.</p>
            </div>

            <div class="comments-list" id="comments-list">
                <!-- Bình luận của chương này sẽ tự động tải vào đây -->
            </div>
        </div>
    </div>

    <script>
        // Phân tích tham số URL
        const params = new URLSearchParams(window.location.search);
        const truyen = params.get('truyen') || 'vong-tron';
        const chuong = parseInt(params.get('chuong')) || 1;

        const storyNames = { 'vong-tron': 'Vòng Tròn Định Mệnh' };
        const storyName = storyNames[truyen] || 'Tên Truyện';
        const tocFile = truyen + '-dinh-menh.html';

        document.getElementById('toc-link').href = tocFile;
        document.getElementById('story-title').innerText = storyName;

        // Khóa lưu trữ bình luận riêng biệt cho từng chương: comments_vong-tron_1, comments_vong-tron_2...
        const commentStorageKey = `comments_${truyen}_${chuong}`;

        const txtPath = `${truyen}-data/${truyen}-${chuong}.txt`;

        // Tải nội dung chương
        fetch(txtPath)
            .then(response => {
                if (!response.ok) throw new Error("Chương này chưa được cập nhật hoặc không tồn tại!");
                return response.text();
            })
            .then(text => {
                parseAndDisplay(text);
                loadComments(); // Tải bình luận riêng của chương này sau khi đọc truyện xong
            })
            .catch(error => {
                showError(error.message);
            });

        function parseAndDisplay(text) {
            const lines = text.split('\n');
            const title = lines[0].trim();
            document.getElementById('chapter-title').innerText = title;
            document.title = title + " - " + storyName;

            const contentLines = lines.slice(1);
            let htmlContent = "";

            contentLines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.length === 0) return;

                if (trimmed === "-" || trimmed === "---" || trimmed === "*" || trimmed === "* * *") {
                    htmlContent += "            <hr class=\"inner-divider\">\n";
                } 
                else if (trimmed.startsWith("*") || trimmed.toLowerCase().includes("chú thích") || trimmed.toLowerCase().includes("lưu ý")) {
                    const cleanNote = trimmed.replace(/^\*|\*$/g, '').trim();
                    htmlContent += "            <div class=\"editor-note\">" + cleanNote + "</div>\n";
                } 
                else {
                    htmlContent += "            <p>" + trimmed + "</p>\n";
                }
            });

            document.getElementById('content-area').innerHTML = htmlContent;

            const prevBtn = document.getElementById('prev-btn');
            if (chuong <= 1) {
                prevBtn.href = tocFile;
                prevBtn.innerText = "Mục Lục";
                prevBtn.style.background = "#9ba89c";
            } else {
                prevBtn.href = `doc.html?truyen=${truyen}&chuong=${chuong - 1}`;
            }

            const nextBtn = document.getElementById('next-btn');
            nextBtn.href = `doc.html?truyen=${truyen}&chuong=${chuong + 1}`;
        }

        // --- XỬ LÝ BÌNH LUẬN RIÊNG TỪNG CHƯƠNG ---
        const nameInput = document.getElementById('comment-name');
        const commentInput = document.getElementById('comment-input');
        const commentSubmit = document.getElementById('comment-submit');
        const commentsList = document.getElementById('comments-list');
        const noComments = document.getElementById('no-comments');

        // Tự động kiểm tra Đăng nhập đồng bộ từ Trang Chủ
        const savedUser = localStorage.getItem('site_user_nickname');
        if(savedUser) {
            nameInput.value = savedUser;
            nameInput.disabled = true; // Khóa không cho đổi tên bậy bạ
        }

        function loadComments() {
            let comments = JSON.parse(localStorage.getItem(commentStorageKey) || '[]');
            
            // Đồng bộ ID cho bình luận cũ nếu chưa có
            let modified = false;
            comments = comments.map(c => {
                if (!c.id) { c.id = Math.floor(Math.random() * 10000000); modified = true; }
                return c;
            });
            if(modified) localStorage.setItem(commentStorageKey, JSON.stringify(comments));

            if (comments.length > 0) {
                noComments.style.display = 'none';
                commentsList.innerHTML = '';
                comments.forEach(c => appendCommentDOM(c.id, c.name, c.text, c.date));
            } else {
                noComments.style.display = 'block';
                commentsList.innerHTML = '';
            }
        }

        function appendCommentDOM(id, name, text, date) {
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.id = 'comment-' + id;
            div.innerHTML = `
                <div class="comment-header">
                    <div>
                        <span class="comment-author">${name}</span>
                        <span class="comment-date">${date}</span>
                    </div>
                    <span class="btn-delete" onclick="deleteComment(${id})">Xóa</span>
                </div>
                <div class="comment-body">${text}</div>
            `;
            commentsList.prepend(div);
        }

        commentSubmit.addEventListener('click', () => {
            const text = commentInput.value.trim();
            const authorName = nameInput.value.trim() || 'Độc giả ẩn danh'; 
            
            if (!text) return alert("Vui lòng nhập nội dung bình luận!");
            
            const dateStr = new Date().toLocaleDateString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
            const newId = Date.now();

            let comments = JSON.parse(localStorage.getItem(commentStorageKey) || '[]');
            comments.push({ id: newId, name: authorName, text: text, date: dateStr });
            localStorage.setItem(commentStorageKey, JSON.stringify(comments));
            
            noComments.style.display = 'none';
            appendCommentDOM(newId, authorName, text, dateStr);
            commentInput.value = '';
        });

        function deleteComment(id) {
            if(!confirm("Bạn có chắc chắn muốn xóa bình luận này không?")) return;
            
            let comments = JSON.parse(localStorage.getItem(commentStorageKey) || '[]');
            comments = comments.filter(c => c.id !== id);
            localStorage.setItem(commentStorageKey, JSON.stringify(comments));
            
            const commentEl = document.getElementById('comment-' + id);
            if(commentEl) commentEl.remove();
            
            if(comments.length === 0) noComments.style.display = 'block';
        }

        function showError(message) {
            const container = document.getElementById('reader-container');
            container.innerHTML = `
                <div class="error-box">
                    <h3>⚠️ Không Tìm Thấy Chương!</h3>
                    <p>${message}</p>
                    <br>
                    <a href="${tocFile}" class="footer-btn" style="display:inline-block; margin-top: 15px; text-decoration:none;">Quay lại Mục Lục</a>
                </div>
            `;
        }
    </script>
</body>
</html>
